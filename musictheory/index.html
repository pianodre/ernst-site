<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Theory | Dylan Ernst</title>
    <meta name="description" content="A music theory resource from Dylan Ernst is on the way.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif;
            background-image: url('../content/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #2c2c2c;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            max-width: 560px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border-top: 3px solid #d4af37;
            animation: fade-in 0.8s ease both;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
        }

        .keys {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(2rem, 6vw, 2.8rem);
            margin-bottom: 8px;
        }

        .coming-soon {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b8942a;
            margin-bottom: 24px;
        }

        p {
            font-weight: 300;
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .home-link {
            display: inline-block;
            font-family: 'Playfair Display', serif;
            text-decoration: none;
            color: #2c2c2c;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 10px 24px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .home-link:hover,
        .home-link:focus-visible {
            background-color: #d4af37;
            color: #fff;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="keys" aria-hidden="true">🎹</div>
        <h1>Music Theory</h1>
        <p class="coming-soon">Coming Soon</p>
        <p>A music theory resource is in the works. Check back soon.</p>
        <a class="home-link" href="../">&larr; Back to Home</a>
    </main>
</body>
</html>
